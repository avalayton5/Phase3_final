<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Database Login</title>
    <link rel="stylesheet" href="/static/login.css">
</head>
<body>
    <div class="login-container">
        <form action="/login" method="POST" class="login-form">
            <h2>Phase 3 Login</h2>
            <p>Enter your credentials to access <strong>phase3_kay_db</strong></p>
            
            <div class="input-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required placeholder="Enter MySQL Username">
            </div>

            <div class="input-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required placeholder="Enter Password">
            </div>

            <button type="submit" class="login-btn">Login to Database</button>
            
            <div class="footer-links">
                <a href="#">Forgot Password?</a>
            </div>
        </form>
    </div>
</body>
</html>
